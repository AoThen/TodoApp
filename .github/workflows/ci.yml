name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: Go 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        env:
          JWT_SECRET: test-secret-key-for-unit-tests-1234567890
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: go test -v -count=1 -race -tags sqlite_fts5 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  go-lint:
    name: Go 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  web-test:
    name: Web 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run vitest with coverage gate
        run: npm run test:coverage

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web/coverage/

  android-test:
    name: Android 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Android lint
        run: ./gradlew lint --no-daemon

  web-e2e:
    name: Web E2E 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      # 后端(:8080)与前端(:3000)均由 playwright webServer 配置托管启停
      - name: Run E2E
        working-directory: web
        env:
          E2E_ADMIN_EMAIL: admin@e2e.local
          E2E_ADMIN_PASSWORD: "E2eAdmin@2026"
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/

  # 注：GitHub 托管 runner 自带 /dev/kvm（需 udev 规则放行 kvm 节点权限，做法见
  # android-e2e.yml），androidTest 目录下的 instrumented 测试（TaskDao/NotificationDao）
  # 由 android-e2e.yml 在托管 runner 的 Android 模拟器上执行：
  # reactivecircus/android-emulator-runner + ./gradlew connectedDebugAndroidTest
